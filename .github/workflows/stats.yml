name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create assets folder
        run: mkdir -p assets

      - name: Download stats card
        run: |
          # cache_seconds=1800 forces the tracker to see your green squares NOW
          curl -o assets/stats.svg "https://vercel.app"

      - name: Download top languages card
        run: |
          curl -o assets/top-langs.svg "https://vercel.app"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: update stats cards" || echo "No changes"
          # FORCE push to overwrite the 'rejected' error
          git push origin HEAD:main --force
